services:
  ollama:
    image: ollama/ollama:latest
    container_name: sop-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment to reach Ollama from the host for debugging:
    # ports:
    #   - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      args:
        INSTALL_IMAGE_TOOLS: "${INSTALL_IMAGE_TOOLS:-false}"
    container_name: sop-chatbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network Ollama is reachable by service name.
      OLLAMA_BASE_URL: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5000}:5000"
    volumes:
      # SOP source documents - edit on the host, rebuild the index to apply.
      - ./docs:/app/docs
      # Index + extracted images. Persisted so a container restart does not
      # require a rebuild.
      - vectorstore:/app/vectorstore
      # SQLite databases, plus the encrypted facility database
      # (database/facilities.enc).
      - ./database:/app/database

volumes:
  ollama_models:
  vectorstore:
